<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#260b15;color:#f8ebcf}
body{font-family:Georgia,serif;overflow:hidden}.stage{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 40%,#713044 0%,#421526 46%,#1d0912 100%)}
.stage:before{content:"";position:absolute;inset:14px;border:1px solid #d5b56f;outline:1px solid #9e793f;outline-offset:5px;z-index:-1}
.stage:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 60px,#e7c77808 61px 62px);z-index:-1}
.card{width:min(92vw,760px);min-height:min(78svh,700px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 24px;position:relative}
.card:before{content:"";position:absolute;inset:0;border:2px solid #c69d59;border-radius:48% 48% 2px 2px/24% 24% 2px 2px;box-shadow:inset 0 0 0 8px #35101f,inset 0 0 0 10px #d6b56d66}
.kicker,.date,.footer{font:600 .68rem Montserrat,Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#e8d29f}
.crown{font-size:2rem;color:#e4c57c;margin-bottom:22px;animation:rise 1.2s both}
.kicker{animation:rise 1s .2s both}
.names{font-size:clamp(3.4rem,10vw,6.4rem);line-height:1.05;font-weight:400;margin:28px 0 10px;color:#fff0d0;text-shadow:0 3px 22px #160810;animation:reveal 1.8s .8s both}
.names span{color:#e4c57c;font-style:italic}
.date{margin-top:20px;animation:rise 1.2s 2.2s both}
.promise{font-size:clamp(1.1rem,3vw,1.6rem);font-style:italic;color:#f4dfb5;margin:36px 0 20px;animation:rise 1.2s 3s both}
.line{height:1px;width:min(60%,320px);background:linear-gradient(90deg,transparent,#d6b56d,transparent);animation:expand 1.5s 1.5s both}
.cta{margin-top:28px;opacity:0;animation:rise 1s 4.2s forwards}
.cta a{display:inline-block;padding:14px 22px;border:1px solid #d8b66c;background:linear-gradient(135deg,#efd89d,#b58b49);color:#3d1423;text-decoration:none;font:600 .68rem Montserrat,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.footer{margin-top:26px;font-size:.55rem;animation:rise 1s 3.6s both}
.spark{position:absolute;color:#e7c77e;opacity:.7;animation:twinkle 3s ease-in-out infinite}
.s1{top:18%;left:17%}.s2{top:25%;right:15%;animation-delay:1s}.s3{bottom:19%;left:20%;animation-delay:1.6s}.s4{bottom:17%;right:18%;animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal{from{opacity:0;transform:scale(.88);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes expand{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}}
</style></head>
<body><main class="stage"><div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✧</div><div class="spark s4">✦</div>
<div class="card"><div class="crown">❧ ✦ ❧</div><div class="kicker">The wedding of</div>
<div class="names">Aniket <span>&amp;</span> Avina</div><div class="line"></div>
<div class="date">1 — 3 December 2026</div><div class="promise">A promise made. A lifetime begins.</div>
<div class="footer">With the blessings of our families</div>
<div class="cta"><a href="/">Open the digital invitation ↗</a></div></div></main></body></html>
